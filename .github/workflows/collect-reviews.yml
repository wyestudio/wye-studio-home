name: Collect Reviews

# 후기 후보 수집 (네이버 블로그 검색 + 인스타 해시태그) 및 설문 평점 갱신.
# 찾아서 쌓아 두기만 하고, 사이트에 싣는 결정은 /admin/reviews 에서 사람이 한다.
#
# ⚠️ 하루 한 번은 꼭 돌아야 한다.
#    인스타 recent_media 는 **쿼리 시점 기준 24시간 내 게시물만** 돌려준다.
#    며칠 거르면 그 사이에 올라온 게시물은 이 통로로 영영 안 보인다
#    (top_media 로 일부는 건지지만 알고리즘이 고른 것만 온다).
#
# ⚠️ curl 은 HTTP 401/500 을 받아도 종료코드가 0 이다. 상태 코드를 직접 보지 않으면
#    실패가 전부 초록불로 찍힌다 — keepalive 잡이 그래서 한 번도 동작하지 않은 적이 있다.

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST. 어제 올라온 글이 다 모인 뒤에 돈다.
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: collect-reviews
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Collect reviews
        env:
          PROD_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${PROD_SECRET:-}" ]; then
            echo "::error::CRON_SECRET 시크릿이 비어 있습니다."
            exit 1
          fi

          # -L 을 쓰지 않고 정규 URL(www 포함)을 직접 친다.
          # 리다이렉트가 뜨면 그것 자체가 설정이 틀렸다는 신호다.
          code=$(curl -sS -o /tmp/collect.out -w '%{http_code}' \
            -X GET "https://www.wouldyouescape.com/api/cron/collect-reviews" \
            -H "x-cron-secret: ${PROD_SECRET}" \
            --max-time 120) || code="000"

          echo "HTTP ${code}"
          cat /tmp/collect.out 2>/dev/null || true
          echo

          if [ "$code" != "200" ]; then
            echo "::error::후기 수집 실패 (HTTP ${code})"
            exit 1
          fi

      # 라우트가 이미 슬랙으로 알리지만(backup-alert), 라우트에 **닿지도 못한 경우**
      # — 배포 실패·도메인 문제·타임아웃 — 는 거기서 알릴 수 없다. 그래서 여기서도 알린다.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_BACKUP_ALERT_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "슬랙 웹훅 미설정 — 알림 생략"
            exit 0
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: 후기 수집 크론이 응답하지 않습니다 (엔드포인트에 닿지 못함). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|실행 로그 보기>\"}"
