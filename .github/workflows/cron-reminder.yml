name: Reminder SMS

# 전날안내 문자(문자3) 자동 발송.
#
# 그동안 /api/cron/reminder 라우트는 완성돼 있었지만 어디에도 등록되지 않아
# 자동 실행되지 않았고, 운영자가 어드민 버튼으로 수동 발송해왔다.
# 매주 정기 운영으로 전환하면 이게 매주 수작업이 되므로 자동화한다.
# 배경: docs/09-implementation-roadmap.md Phase 0-4
#
# ─────────────────────────────────────────────────────────────────
# 왜 Vercel Cron 이 아니라 GitHub Actions 인가
#   Vercel Hobby 플랜은 크론이 "하루 1회"로 제한되고 ±59분 오차가 있다.
#   ("Hobby accounts are limited to daily cron jobs. Cron expressions that
#     would run more frequently will fail during deployment." — Vercel 공식 문서)
#   그런데 라우트의 대상 조건이 "지금부터 24시간 이내 시작하는 회차"라
#   하루 1회로는 타이밍이 어긋난다.
#     예) 금 10:00 실행 → 창은 금10:00~토10:00 → 토 14:00 회차가 창 밖
#         토 10:00 실행 → 이제야 잡히지만 시작 4시간 전이라 "전날"안내가 아님
#   따라서 몇 시간 간격 실행이 필요하고, Hobby 에서는 외부 실행기가 답이다.
#
# 왜 이 잡은 GitHub Actions 로 충분한가
#   GitHub 의 schedule 은 "부하가 높으면 지연되거나 큐에서 버려질 수 있다"고
#   공식 문서가 명시한다. 하지만 이 잡은
#     - 하루 6번 시도하므로 한 번 유실돼도 다음 회차에 복구되고
#     - reminder_sms_sent_at 마커가 있어 중복 발송이 불가능하다
#   반면 Phase 5 의 입금 매칭은 유실 시 고객 입금이 확인되지 않으므로
#   GitHub Actions 로 하면 안 된다. 외부 전용 크론 서비스를 쓸 것.
# ─────────────────────────────────────────────────────────────────

on:
  schedule:
    # UTC 01,03,05,07,09,11시 17분  =  KST 10:17 ~ 20:17 (2시간 간격, 하루 6회)
    #
    # ⚠️ 시간대를 낮으로 제한한 이유: 고객에게 실제 문자가 나가는 잡이다.
    #    24시간 균등 실행하면 새벽 3시에 안내 문자가 발송된다.
    # ⚠️ 정각(:00)을 피한 이유: GitHub 문서가 "high load times include the
    #    start of every hour" 라고 명시한다. 정각을 피하면 유실 확률이 낮아진다.
    - cron: "17 1-11/2 * * *"
  workflow_dispatch:

concurrency:
  group: cron-reminder
  cancel-in-progress: false

jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          # 토큰은 쿼리스트링이 아니라 헤더로 보낸다.
          # 쿼리스트링에 담으면 액세스 로그·리퍼러에 시크릿이 남는다.
          HTTP=$(curl -sS -o response.json -w '%{http_code}' \
            -X GET "https://www.wouldyouescape.com/api/cron/reminder" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            --max-time 120)

          echo "HTTP $HTTP"
          cat response.json
          echo

          if [ "$HTTP" != "200" ]; then
            echo "::error::전날안내 크론 호출 실패 (HTTP $HTTP)"
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 생략"
            exit 0
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: 전날안내 크론 실패 — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|실행 로그 보기>\"}"
