name: Cron Reminder

on:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder API
        run: |
          curl -X GET "https://wouldyouescape.com/api/cron/reminder" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP Status: %{http_code}\n"
